# Think-reward experiment: Level-2 RL from the Level 1-2 Think SFT adapters, Level-3 zero-shot evaluation.
model: /datacache/huggingface/hub/models--Qwen--Qwen3-1.7B/snapshots/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
adapters:
  chef: runs/think_judge/sft_think_l12/Chef
  assistant: runs/think_judge/sft_think_l12/Assistant
level: 2
response_protocol: think_action
max_new_tokens: 384
temperature: 0.7
objective: agentgym
lr: 1.0e-5
kl_coef: 0.02
reward: {format_penalty: 0.2, validator_penalty: 0.1, ites_weight: 1.0, tes_beta: 0.95}
terminal_reward: 2.0
tokens_per_batch: 4096
vllm_python: /home/zhangshuwen/vllm/bin/python
vllm_kv_cache_gib: 6
seed: 261008

# ---- corrected-baselines study (2026-11-02, framework audit /archive/public/zhangshuwen/framework_audit_20261102) ----
# level 2, train dishes only, SFT init, horizon schedule as l2r_none; no LLM judge, think_reward none
tasks: [baked_pumpkin_slices, boiled_green_bean_slices, boiled_potato_slices]
updates: 50
horizon: 50
horizon_schedule: [[3, 20], [6, 35]]
judge: null
think_reward: {mode: none, weight: 0.0}
checkpoint_every: 25
save_every: 25
kl_guard: {min_token_logprob: -9.21, max_update_kl: 0.05, max_ref_kl: 1.0, lr_decay: 0.5, min_lr_scale: 0.1}
# PPO with a call-level critic (one value per call at its prompt), GAE gamma 0.98 lam 0.95, penalties local
# value-head lr 1e-4 (smoke with 1e-3: value overshoot, clipfrac 0.41, held-out EV -3.3 at update 2)
advantage_estimator: gae
episodes_per_update: 8
critic: {level: call, lr: 1.0e-5, head_lr: 1.0e-4, epochs: 2, persistent: true, gamma: 0.98, lam: 0.95,
         cliprange_value: 0.5, warmup: 0, gates: [], local_penalties: true, std_floor: 0.0}
rollout_workers: 8
output_dir: runs/think_judge/rl/l2p_ppo_fix
