# ---- team-grounded reward (2026-11-03, docs/reward_redesign.md; offline gate
# /archive/public/zhangshuwen/reward_redesign_20261103/) ----
# team reward per timestep = team reference-progress increment + 1 at delivery; team return, discount 0.7 per
# timestep; local: invalid output (incl. no Action) -0.5 with A capped at it, rejected action -0.2, -0.01 per call
reward_scheme: team
team: {gamma: 0.7, progress_weight: 1.0, success_reward: 1.0, call_cost: 0.01, shaping: delta}
reward: {format_penalty: 0.5, validator_penalty: 0.2, ites_weight: 1.0, tes_beta: 0.95, empty_invalid: true}
terminal_reward: 2.0   # unused under reward_scheme team
# optimisation: 4 shuffled optimizer steps per role per update; stronger KL to the SFT policy, tighter guard
update_steps: 4
kl_coef: 0.05
kl_guard: {min_token_logprob: -9.21, max_update_kl: 0.05, max_ref_kl: 0.2, lr_decay: 0.5, min_lr_scale: 0.1}
episodes_per_update: 12
group_size: 4
updates: 2
horizon: 20
horizon_schedule: []
episodes_per_update: 4
advantage_estimator: team
team: {gamma: 0.7, progress_weight: 1.0, success_reward: 1.0, call_cost: 0.01, shaping: delta, baseline: group_time}
save_every: 1
output_dir: runs/think_judge/rl/l2tm_smoke
