environment:
  order: baked_bell_pepper
  horizon: 24
reward:
  product_reward: 0.0
  communication_penalty: 0.1
  forced_communication_penalty: 0.4
  paired_comm_reward_enabled: true
  paired_comm_request_positive_reward: 0.5
  paired_comm_request_negative_reward: -0.1
  paired_comm_response_positive_reward: 0.5
  paired_comm_response_negative_reward: -0.1
  paired_comm_deny_reward: 1.0
trainer:
  type: mappo
  collect_only: true
  train_only: false
  model_path: /datacache/LLMs/Qwen2.5-3B-Instruct
  lora_path: null
  actor_adapters:
    agent_0:
      adapter_name: Chef
      lora_path: null
    agent_1:
      adapter_name: Assistant
      lora_path: null
  critic_adapter:
    adapter_name: critic
    lora_path: null
    lora_config:
      r: 16
      alpha: 32
      dropout: 0.05
  rollout_dir: rollouts_eval_kl_qwen25_3b_base
  latest_model_path_file: null
  generation_temperature: 0.0
  max_new_tokens: 512
  evaluation_batch_size: 6
  fix_mistral_regex: true
  output_dir: results/rl_eval_kl_qwen25_3b_base
agents:
  num_agents: 2
  agent_0:
    type: vllm
    model: qwen2.5-3B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9000/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Chef
    local_model_path: /datacache/LLMs/Qwen2.5-3B-Instruct
    cuda_visible_devices:
    - 0
    data_parallel_size: 1
  agent_1:
    type: vllm
    model: qwen2.5-3B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9001/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Assistant
    local_model_path: /datacache/LLMs/Qwen2.5-3B-Instruct
    cuda_visible_devices:
    - 1
    data_parallel_size: 1
