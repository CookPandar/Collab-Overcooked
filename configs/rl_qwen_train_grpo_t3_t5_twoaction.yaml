environment:
  order: baked_bell_pepper
  horizon: 8
reward:
  communication_penalty: 0.0
  forced_communication_penalty: 0.05
  format_penalty: 0.2
  validator_penalty: 0.1
  format_success_reward: 0.05
  validator_success_reward: 0.05
  process_progress_reward: 2.0
  collab_reward_enabled: false
  sequence_metric: lcs
  sequence_weight: 0.2
  paired_comm_reward_enabled: false
  paired_comm_request_positive_reward: 0.0
  paired_comm_request_negative_reward: 0.0
  paired_comm_response_positive_reward: 0.0
  paired_comm_response_negative_reward: 0.0
  paired_comm_deny_reward: 0.0
  reference_overrides:
    agent_0:
      - pickup(bell_pepper,counter)
    agent_1:
      - pickup(bell_pepper,ingredient_dispenser)
      - place_obj_on_counter()
trainer:
  type: grpo
  train_only: true
  collect_only: false
  fix_mistral_regex: true
  model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
  lora_path: null
  lora: {}
  actor_adapters:
    agent_0:
      adapter_name: Chef
      lora_path: ./runs/Chef
    agent_1:
      adapter_name: Assistant
      lora_path: ./runs/Assistant
  rollout_dir: rollouts_grpo
  output_dir: runs/grpo/train
  save_interval: 1
  checkpoint_interval: 0
  export_latest_dir: runs/grpo/export_latest
  latest_model_path_file: runs/grpo/latest_model.json
  apply_latest_model_override: true
  export_interval: 1
  max_new_tokens: 512
  generation_temperature: 0.0
  evaluation_batch_size: 32
  gamma: 1.0
  actor_lr: 1.0e-06
  critic_lr: 0.0
  value_head_lr: 0.0
  lr_scheduler: constant
  lr_warmup_updates: 0
  lr_min_ratio: 1.0
  train_batch_size: 1
  update_epochs: 1
  gradient_checkpointing: true
  gradient_accumulation_steps: 8
  target_kl: null
  kl_penalty_coef: 0.20
  clip_coef: 0.15
  entropy_coef: 0.0
  dual_clip_loss: true
  max_grad_norm: 0.5
  cleanup_rollouts: false
  success_replay:
    enabled: true
    mode: elite_bc
    max_episodes: 50
    sample_episodes: 8
    bc_weight: 0.2
    min_partial_success_reward: 20.0
  grpo:
    norm_scope: agent
    normalize: mean_std
    gamma: 1.0
    advantage_clip: 10.0
    whiten_advantages: false
    recompute_old_log_probs: true
    positive_return_source: reward
    positive_advantage_requires_positive_return: false
    positive_return_threshold: 0.0
    positive_only_advantages: false
    include_rewarded_filtered_actions: false
    train_action_modes:
      - planner_main
agents:
  num_agents: 2
  agent_0:
    type: vllm
    model: qwen2.5-7B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9000/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Chef
    local_model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
    cuda_visible_devices:
      - 0
    data_parallel_size: 1
  agent_1:
    type: vllm
    model: qwen2.5-7B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9001/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Assistant
    local_model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
    cuda_visible_devices:
      - 1
    data_parallel_size: 1
