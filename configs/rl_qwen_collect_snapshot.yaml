environment:
  order: baked_bell_pepper   
  horizon: 16

reward:
  communication_penalty: 0.1
  forced_communication_penalty: 0.4

trainer:
  type: mappo
  collect_only: true
  off_policy_snapshots: runs/rl/snapshots/one_episode.jsonl
  model_path: /datacache/LLMs/Qwen2.5-7B-Instruct            # 共享基座
  lora_path: null
  actor_adapters:
    agent_0:
      adapter_name: Chef
      lora_path: ./runs/Chef     # Chef 初始 LoRA
    agent_1:
      adapter_name: Assistant
      lora_path: ./runs/Assistant   # Assistant 初始 LoRA
  critic_adapter:
    adapter_name: critic
    lora_path: null
    lora_config:
      r: 16
      alpha: 32
      dropout: 0.05
  latest_model_path_file: runs/rl/latest_model.json  # 采样前自动重载最新模型
  generation_temperature: 0.7              # 用温度做多样性
  evaluation_batch_size: 4
  max_new_tokens: 512
  fix_mistral_regex: true


  # Agent settings
agents:
  num_agents: 2
  agent_0:
    type: "openai"  # openai, vllm, custom_api
    model: "qwen2.5-7B-instruct"
    api_key: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJHbW9oUjdNTTQ0cGpQTmIwZ2tKTjFIZ1J2bkJkcjdxQSJ9.0xbuBWNX5wKkvLrQTPo5xFMQ1t1-2MNIURnNQ4Q4KQM"  # Required for OpenAI/custom API
    base_url: "http://127.0.0.1:8000/v1"  # Optional for OpenAI, required for custom_api
    model_dirname: ""  # Use served model name directly when calling local OpenAI API
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Chef"
  agent_1:
    type: "openai"
    model: "qwen2.5-7B-instruct"
    api_key: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJHbW9oUjdNTTQ0cGpQTmIwZ2tKTjFIZ1J2bkJkcjdxQSJ9.0xbuBWNX5wKkvLrQTPo5xFMQ1t1-2MNIURnNQ4Q4KQM"  # Required for OpenAI/custom API
    base_url: "http://127.0.0.1:8000/v1"
    model_dirname: ""
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Assistant"
