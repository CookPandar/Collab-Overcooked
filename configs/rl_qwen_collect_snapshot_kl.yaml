environment:
  order: baked_bell_pepper
  horizon: 16

reward:
  communication_penalty: 0.1
  forced_communication_penalty: 0.4

trainer:
  type: mappo
  collect_only: true
  off_policy_snapshots: runs/rl/snapshots/one_episode.jsonl
  steps_per_update: 200
  rollout_dir: ./rollouts_kl
  initial_rollout_cache_dir: runs/rl/train_kl/initial_rollout_cache
  model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
  lora_path: null
  actor_adapters:
    agent_0:
      adapter_name: Chef
      lora_path: ./runs/Chef
    agent_1:
      adapter_name: Assistant
      lora_path: ./runs/Assistant
  critic_adapter:
    adapter_name: critic
    lora_path: null
    lora_config:
      r: 16
      alpha: 32
      dropout: 0.05
  latest_model_path_file: runs/rl/latest_model_kl.json
  generation_temperature: 0.7
  evaluation_batch_size: 4
  max_new_tokens: 512
  fix_mistral_regex: true

agents:
  num_agents: 2
  agent_0:
    type: "openai"
    model: "qwen2.5-7B-instruct"
    api_key: "YOUR_API_KEY"
    base_url: "http://127.0.0.1:8000/v1"
    model_dirname: ""
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Chef"
  agent_1:
    type: "openai"
    model: "qwen2.5-7B-instruct"
    api_key: "YOUR_API_KEY"
    base_url: "http://127.0.0.1:8000/v1"
    model_dirname: ""
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Assistant"
