environment:
  layout: "cramped_room"
  order: "baked_bell_pepper"
  horizon: 24

trainer:
  type: "mappo_deepspeed"
  model_path: "../models/qwen2.5-7b"
  output_dir: "runs/rl/deepspeed_baked_bell_pepper"
  deepspeed_config: "configs/deepspeed/mappo_zero3.json"
  save_interval: 50
  max_new_tokens: 256
  generation_temperature: 0.7
  gamma: 0.99
  gae_lambda: 0.95
  total_updates: 100
  clip_coef: 0.2
  entropy_coef: 0.01
  value_coef: 0.5

agents:
  num_agents: 2
  agent_0:
    type: "openai"
    model: "qwen2.5-7b"
    api_key: "<local_api_key>"
    base_url: "http://127.0.0.1:8000/v1"
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Chef"
  agent_1:
    type: "openai"
    model: "qwen2.5-7b"
    api_key: "<local_api_key>"
    base_url: "http://127.0.0.1:8000/v1"
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Assistant"
