environment:
  layout: "cramped_room"
  order: "baked_bell_pepper"
  horizon: 24

trainer:
  type: "mappo"
  model_path: "../models/qwen2.5-7b"
  output_dir: "runs/rl/baked_bell_pepper"
  save_interval: 50
  max_new_tokens: 256
  generation_temperature: 0.7
  device: "cuda"
  gamma: 0.99
  gae_lambda: 0.95
  lr: 1.0e-5
  total_updates: 100
  clip_coef: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  reward:
    shaping: 1.0

# Agent settings
agents:
  num_agents: 2
  agent_0:
    type: "openai"  # openai, vllm, custom_api
    model: "qwen2.5-7b"
    api_key: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJHbW9oUjdNTTQ0cGpQTmIwZ2tKTjFIZ1J2bkJkcjdxQSJ9.0xbuBWNX5wKkvLrQTPo5xFMQ1t1-2MNIURnNQ4Q4KQM"  # Required for OpenAI/custom API
    base_url: "http://127.0.0.1:8000/v1"  # Optional for OpenAI, required for custom_api
    model_dirname: ""  # Use served model name directly when calling local OpenAI API
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Chef"
  agent_1:
    type: "openai"
    model: "qwen2.5-7b"
    api_key: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJHbW9oUjdNTTQ0cGpQTmIwZ2tKTjFIZ1J2bkJkcjdxQSJ9.0xbuBWNX5wKkvLrQTPo5xFMQ1t1-2MNIURnNQ4Q4KQM"  # Required for OpenAI/custom API
    base_url: "http://127.0.0.1:8000/v1"
    model_dirname: ""
    temperature: 0
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Assistant"
