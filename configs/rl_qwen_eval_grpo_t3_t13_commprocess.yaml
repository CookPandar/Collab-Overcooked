environment:
  order: baked_bell_pepper
  horizon: 18
reward:
  communication_penalty: 0.0
  forced_communication_penalty: 0.05
  format_penalty: 0.2
  validator_penalty: 0.1
  process_progress_reward: 2.0
  collab_reward_enabled: false
  sequence_metric: lcs
  sequence_weight: 0.2
  paired_comm_reward_enabled: true
  paired_comm_request_positive_reward: 0.5
  paired_comm_request_negative_reward: -0.1
  paired_comm_response_positive_reward: 0.5
  paired_comm_response_negative_reward: -0.1
  paired_comm_deny_reward: 0.2
trainer:
  type: grpo
  collect_only: true
  train_only: false
  off_policy_snapshots: runs/rl/snapshots/one_episode_t3_t13.jsonl
  snapshot_rollout_mode: autoregressive
  partial_success:
    type: oven_cooking
    utensil: oven0
    target: baked_bell_pepper
    terminal_reward: 20.0
  model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
  lora_path: null
  actor_adapters:
    agent_0:
      adapter_name: Chef
      lora_path: null
    agent_1:
      adapter_name: Assistant
      lora_path: null
  rollout_dir: rollouts_eval_grpo
  latest_model_path_file: runs/grpo/latest_model.json
  generation_temperature: 0.0
  max_new_tokens: 512
  evaluation_batch_size: 6
  compute_values_in_collect: false
  fix_mistral_regex: true
  output_dir: results/grpo_eval
  grpo:
    norm_scope: agent
    normalize: mean_std
    gamma: 1.0
    advantage_clip: 10.0
agents:
  num_agents: 2
  agent_0:
    type: vllm
    model: qwen2.5-7B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9000/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Chef
    local_model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
    cuda_visible_devices:
    - 0
    data_parallel_size: 1
  agent_1:
    type: vllm
    model: qwen2.5-7B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9001/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Assistant
    local_model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
    cuda_visible_devices:
    - 1
    data_parallel_size: 1
