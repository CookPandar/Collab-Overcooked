environment:
  order: baked_bell_pepper
  horizon: 18
reward:
  communication_penalty: 0.0
  forced_communication_penalty: 0.05
  format_penalty: 0.2
  validator_penalty: 0.1
  paired_comm_reward_enabled: true
  paired_comm_request_positive_reward: 0.5
  paired_comm_request_negative_reward: -0.1
  paired_comm_response_positive_reward: 0.5
  paired_comm_response_negative_reward: -0.1
  paired_comm_deny_reward: 1.0
trainer:
  type: grpo
  train_only: true
  collect_only: false
  fix_mistral_regex: true
  model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
  lora_path: null
  lora: {}
  actor_adapters:
    agent_0:
      adapter_name: Chef
      lora_path: ./runs/Chef
    agent_1:
      adapter_name: Assistant
      lora_path: ./runs/Assistant
  rollout_dir: rollouts_grpo
  output_dir: runs/grpo/train
  save_interval: 1
  checkpoint_interval: 0
  export_latest_dir: runs/grpo/export_latest
  latest_model_path_file: runs/grpo/latest_model.json
  apply_latest_model_override: true
  export_interval: 1
  max_new_tokens: 512
  generation_temperature: 0.0
  evaluation_batch_size: 32
  gamma: 1.0
  actor_lr: 1.0e-06
  critic_lr: 0.0
  value_head_lr: 0.0
  lr_scheduler: linear
  lr_warmup_updates: 0
  lr_min_ratio: 0.0
  train_batch_size: 1
  update_epochs: 1
  gradient_checkpointing: true
  gradient_accumulation_steps: 8
  target_kl: null
  kl_penalty_coef: 0.20
  clip_coef: 0.15
  entropy_coef: 0.0
  dual_clip_loss: true
  max_grad_norm: 0.5
  cleanup_rollouts: false
  grpo:
    norm_scope: agent
    normalize: mean_std
    gamma: 1.0
    advantage_clip: 10.0
agents:
  num_agents: 2
  agent_0:
    type: vllm
    model: qwen2.5-7B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9000/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Chef
    local_model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
    cuda_visible_devices:
    - 0
    data_parallel_size: 1
  agent_1:
    type: vllm
    model: qwen2.5-7B-instruct
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:9001/v1
    temperature: 0
    max_tokens: 512
    timeout: 180
    max_retries: 3
    role: Assistant
    local_model_path: /datacache/LLMs/Qwen2.5-7B-Instruct
    cuda_visible_devices:
    - 1
    data_parallel_size: 1
