field_categories:
  metadata:
    description: "Paper identity, venue, source links, and code availability."
    fields:
      - name: "title"
        description: "Full paper title."
        detail_level: "brief"
      - name: "venue"
        description: "ACL 2026 Long or Findings."
        detail_level: "brief"
      - name: "paper_url"
        description: "Official ACL Anthology PDF or page."
        detail_level: "brief"
      - name: "code_repository"
        description: "Official repository if stated in the paper or discoverable from the paper."
        detail_level: "brief"
  method:
    description: "Core technical method for LLM multi-agent RL or coordination."
    fields:
      - name: "agent_roles"
        description: "Number and roles of agents, or controller/policy modules."
        detail_level: "moderate"
      - name: "training_target"
        description: "Whether the optimized object is the LLM policy, a topology/router/controller, or synthetic data."
        detail_level: "detailed"
      - name: "collaborative_training"
        description: "Whether multiple agents or policies are optimized jointly or co-evolve in a shared environment."
        detail_level: "detailed"
      - name: "credit_assignment"
        description: "How rewards or labels are assigned to agents, edges, states, or trajectories."
        detail_level: "detailed"
  algorithm:
    description: "Optimization algorithms and RL details."
    fields:
      - name: "algorithm_family"
        description: "Examples: PPO, GRPO, MAPPO, MCTS, DPO, policy gradient, CTDE."
        detail_level: "brief"
      - name: "reward_design"
        description: "Outcome reward, verifiable reward, privacy reward, edge-level advantage, or composite reward."
        detail_level: "detailed"
      - name: "rollout_strategy"
        description: "Group sampling, MCTS nodes, multi-agent tree expansion, rollout count, or communication rounds."
        detail_level: "moderate"
  benchmarks:
    description: "Training and evaluation datasets or environments."
    fields:
      - name: "training_data"
        description: "Data used for RL, SFT, DPO, or self-training."
        detail_level: "moderate"
      - name: "evaluation_benchmarks"
        description: "Benchmarks and task domains used for reported evaluation."
        detail_level: "detailed"
      - name: "metrics"
        description: "Accuracy, EM/F1, Pass@N, task/privacy score, factuality, success rate, or safety metrics."
        detail_level: "moderate"
  compute:
    description: "Training and evaluation resource requirements."
    fields:
      - name: "hardware"
        description: "GPU/cluster type and count when reported."
        detail_level: "detailed"
      - name: "batch_size"
        description: "Global batch, PPO batch, rollout batch, SFT/DPO batch, or transition batch."
        detail_level: "detailed"
      - name: "parallelism"
        description: "FSDP, vLLM engines, number of nodes, tensor parallelism, or decentralized nodes."
        detail_level: "moderate"
  uncertainty:
    description: "Fields that are missing or not reported in the paper."
    fields:
      - name: "missing_code"
        description: "Whether the paper lacks an official repository."
        detail_level: "brief"
      - name: "missing_compute_details"
        description: "Which hardware or batch parameters are not reported."
        detail_level: "brief"
uncertain:
  - "Some repositories may have changed after 2026-07-26."
  - "Several papers report GPU family without exact GPU count or batch size."
  - "Controller-only training is not equivalent to co-training LLM agent policies."
